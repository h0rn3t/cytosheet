[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "Cython>=3.0.11",
    "lxml>=4.9"
]
build-backend = "setuptools.build_meta"

[project]
name = "cytosheet"
version = "0.1.0"
description = "A high-performance XLSX parser and writer built with Cython and lxml"
authors = [
    { name="Your Name", email="your.email@example.com" }
]
license = { text = "MIT" }
dependencies = [
    "Cython>=3.0.11",
    "lxml>=4.9"
]

[project.urls]
homepage = "https://github.com/yourusername/cytosheet"
repository = "https://github.com/yourusername/cytosheet"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["cytosheet"]

[tool.setuptools.package-data]
"cytosheet" = ["*.pxd"]
